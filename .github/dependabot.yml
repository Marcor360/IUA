version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # TypeScript 7 is deferred until typescript-eslint supports it.
    # Remove this entry when compiler and lint peer dependencies are compatible.
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
